tool_version = "0.3.1"
project_name = "spec-pm"
memory_dir = "docs/spm"
state_file = "docs/spm/current.md"
handoffs_dir = "docs/spm/handoffs"
specs_dir = "docs/spm/specs"
tasks_dir = "docs/spm/tasks"
skills_dir = "docs/spm/skills"

[memory_scopes.session]
enabled = true
dir = ".specpm/memory/session"
write_policy = "read-write"

[memory_scopes.org]
enabled = true
dir = ".specpm/memory/org"
write_policy = "read-only"

[agents]
context_window_tokens = 400000
root_target_ratio = 0.00225
root_hard_cap_ratio = 0.003
chain_target_ratio = 0.0045
chain_hard_cap_ratio = 0.0055
absolute_root_hard_cap = 4000
absolute_chain_hard_cap = 8000

[defaults]
resume_backend = "deterministic"

[nexus]
enabled = false
command = "gitnexus"
args = []
root_agents_mode = "reference-only"

[backends.deterministic]
enabled = true

[backends.prompt]
enabled = true

[backends.codex]
enabled = false
command = "codex"
args = ["exec", "{prompt_text_file}"]

[backends.claude]
enabled = false
command = "claude"
args = ["-p", "{prompt}"]
